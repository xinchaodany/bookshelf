<style>
/* Designed for E Ink phones (Boox Palma): pure black & white, no motion, big targets, paged reading. */
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
  --bg:#FFFFFF; --ink:#000000; --muted:#333333; --soft:#B5B5B5; --hl:#D4D4D4;
  --accent:#000000; --accent-ink:#FFFFFF;
  --ui:"Droid Sans", "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --serif:"Droid Serif", Literata, Georgia, "Times New Roman", serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]):not([data-theme="soft"]){
    color-scheme:dark;
    --bg:#000000; --ink:#FFFFFF; --muted:#CFCFCF; --soft:#5C5C5C; --hl:#3D3D3D;
    --accent:#FFFFFF; --accent-ink:#000000;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#000000; --ink:#FFFFFF; --muted:#CFCFCF; --soft:#5C5C5C; --hl:#3D3D3D;
  --accent:#FFFFFF; --accent-ink:#000000;
}
*,*::before,*::after{box-sizing:inherit;transition:none !important;animation:none !important}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:13.6px;line-height:1.45;font-weight:500;
  --rbg:var(--bg); --rink:var(--ink); --rmuted:var(--muted); --rhl:var(--hl);
}
body[data-rt="paper"]{--rbg:#FFFFFF;--rink:#000000;--rmuted:#333333;--rhl:#D4D4D4}
body[data-rt="invert"]{--rbg:#000000;--rink:#FFFFFF;--rmuted:#CFCFCF;--rhl:#3D3D3D}
body[data-rt="soft"]{--rbg:#F4F0E7;--rink:#111111;--rmuted:#777777;--rhl:#E6E1D7}
body[data-view="reader"]{overflow:hidden;background:var(--rbg)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
body[data-view="reader"]::before{background:var(--rbg)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--ink);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5.1px;min-height:39.1px;padding:0 13.6px;border:2px solid var(--ink);background:var(--bg);color:var(--ink);border-radius:6.8px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.plain{border-color:transparent}
.btn.danger.armed{background:var(--ink);color:var(--bg)}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none !important}
.noterow{display:flex;align-items:flex-start;gap:6.8px}
.noterow > p{flex:1}
.x{all:unset;box-sizing:border-box;flex:none;width:32.3px;height:32.3px;margin:-7.7px -7.7px 0 0;display:grid;place-items:center;cursor:pointer}
.x .ri{width:17px;height:17px}
.x:focus-visible{outline:2.5px solid currentColor;outline-offset:-2.5px}
.ri{width:1.25em;height:1.25em;flex:none;fill:currentColor;display:inline-block;vertical-align:-.25em}
.btn .ri{width:18.7px;height:18.7px}
.btn.icon{padding:0;width:39.1px}
.ri.big{width:47.6px;height:47.6px;margin-bottom:10.2px}
.searchwrap{position:relative;margin-top:10.2px}
.searchrow{display:flex;gap:6.8px;margin-top:10.2px}
.searchrow .searchwrap{flex:1;min-width:0;margin-top:0}
.sortwrap{flex:none}
.sortwrap select{min-height:39.1px;border:2px solid var(--ink);border-radius:6.8px;background:var(--bg);color:var(--ink);padding:0 8.5px 0 10.2px;font-size:12.8px;font-weight:600;max-width:127.5px}
.searchwrap .ri,.selwrap .ri{position:absolute;top:50%;transform:translateY(-50%);pointer-events:none;width:18.7px;height:18.7px}
.searchwrap .ri{left:11.1px}
.selwrap{position:relative;display:block}
.selwrap .ri{right:10.2px}
.selwrap select{appearance:none;-webkit-appearance:none;padding-right:35.7px !important}
.seg{display:inline-flex;border:2px solid var(--ink);border-radius:6.8px;overflow:hidden}
.seg button{border:0;background:transparent;min-height:35.7px;padding:0 11.1px;cursor:pointer;font-weight:600}
.seg button+button{border-left:2px solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* ---------- Library ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:2px solid var(--ink);padding:10.2px 13.6px 10.2px}
.top-row{display:flex;align-items:center;gap:8.5px}
.brand{font-family:var(--serif);font-size:23px;font-weight:700;margin:0 auto 0 0;letter-spacing:-.01em;line-height:1.1;display:flex;align-items:center;gap:8.5px}
.logo{height:22.1px;width:auto;fill:currentColor;flex:none}
.search{display:block;width:100%;padding-left:37.4px !important;min-height:39.1px;border:2px solid var(--ink);background:var(--bg);border-radius:6.8px;padding:0 11.9px;font-size:13.6px}
.search::placeholder{color:var(--muted);opacity:1}
.count{margin:0;padding:10.2px 13.6px 3.4px;color:var(--muted);font-size:11.5px}
.shead{padding:8.5px 6.8px 3.4px;border-bottom:2px solid var(--ink)}
.shead .btn{padding:0 6.8px}
.shead h2{font-family:var(--serif);font-weight:700;font-size:20.4px;margin:3.4px 6.8px 0;line-height:1.2}
.shead p{margin:2px 6.8px 8.5px;color:var(--muted);font-size:11.5px}
.list{list-style:none;margin:0;padding:0 0 calc(34px + env(safe-area-inset-bottom,0px))}
.item{display:flex;align-items:stretch;border-bottom:1px solid var(--soft)}
.open{all:unset;box-sizing:border-box;flex:1;min-width:0;display:flex;gap:12.8px;padding:11.9px 3.4px 11.9px 13.6px;cursor:pointer}
.open:focus-visible,.more:focus-visible{outline:2.5px solid var(--ink);outline-offset:-2.5px}
.more{all:unset;box-sizing:border-box;flex:none;width:45.9px;display:grid;place-items:center;cursor:pointer}
.more .ri{width:22.1px;height:22.1px}
.thumb{display:block;flex:none;position:relative;width:49.3px;height:73.1px;border:2px solid var(--ink);border-radius:2px 4.2px 4.2px 2px;background:var(--bg);color:var(--ink);
  padding:5.1px 4.2px 4.2px 7.7px;box-shadow:inset 2.5px 0 0 var(--ink);overflow:hidden}
.thumb .tt{font-family:var(--serif);font-size:8.5px;line-height:1.15;font-weight:700;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.thumb.s1{background:var(--ink);color:var(--bg);box-shadow:inset 2.5px 0 0 var(--bg)}
.thumb.s2::after{content:"";position:absolute;left:2.5px;right:0;bottom:13.6px;height:5.9px;background:var(--ink)}
.thumb.stack{margin:6.8px 6.8px 0 0;box-shadow:inset 2.5px 0 0 var(--ink),3.4px -3.4px 0 -2px var(--bg),3.4px -3.4px 0 0 var(--ink),6.8px -6.8px 0 -2px var(--bg),6.8px -6.8px 0 0 var(--ink);overflow:visible}
.thumb.stack.s1{box-shadow:inset 2.5px 0 0 var(--bg),3.4px -3.4px 0 -2px var(--bg),3.4px -3.4px 0 0 var(--ink),6.8px -6.8px 0 -2px var(--bg),6.8px -6.8px 0 0 var(--ink)}
.thumb.img{padding:0}
.thumb.img::after{content:none}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;border-radius:inherit}
.now{margin:0 13.6px 8.5px;border:2px solid var(--ink);border-radius:8.5px}
.nowhead{margin:13.6px 13.6px 6.8px;font-size:10.2px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
/* Continue reading (grid): up to 3 slightly bigger covers in one row; swipe sideways if they don't all fit */
.nowgrid{display:grid;grid-auto-flow:column;grid-auto-columns:min(calc((100% - 23.8px) / 3 * 1.3), 153px);justify-content:start;gap:13.6px 15.3px;margin:0 0 5.1px;padding:0 13.6px 4px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 13.6px;scrollbar-width:none}
.nowgrid::-webkit-scrollbar{display:none}
.nowgrid > .cell{scroll-snap-align:start}
.nowgrid .cell .ctitle b{font-size:12.8px}
.viewseg button{padding:0 8.5px;display:grid;place-items:center}
.viewseg .ri{width:17px;height:17px}
/* Grid view */
/* responsive: 3 covers per row on the Palma, more on wider screens */
.list.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18.7px 11.9px;padding:11.9px 13.6px calc(34px + env(safe-area-inset-bottom,0px))}
@media (min-width:480px){.list.grid{grid-template-columns:repeat(auto-fill,minmax(119px,1fr))}}
.cell{display:flex;flex-direction:column;min-width:0;position:relative}
.star{all:unset;box-sizing:border-box;flex:none;width:35.7px;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.star .ri{width:18.7px;height:18.7px}
.star:focus-visible{outline:2.5px solid var(--ink);outline-offset:-2.5px}
.item .star + .more{width:39.1px}
.prog > span:last-child{white-space:nowrap}
.prog .bar{min-width:30.6px}
/* big 40.8px touch area with a 28.9px visible circle, so it's easy to hit on the Palma */

  font-family:var(--rfont,var(--serif));font-size:var(--rsize,17px);line-height:var(--rlh,1.6);letter-spacing:var(--rls,0);font-weight:var(--rw,400);overflow-wrap:break-word;hyphens:auto}

  display:flex;align-items:center;gap:3.4px;font-size:11.1px;background:var(--rbg);color:var(--rink);border-top:1px solid var(--rink)}
.status button{all:unset;box-sizing:border-box;min-width:35.7px;height:32.3px;display:grid;place-items:center;font-size:13.6px;font-weight:700;cursor:pointer}

/* two columns: clock + title | page */

/* Floating button shown while read-aloud is active: opens the playback controls */

.fabbar{position:fixed;left:15.3px;right:15.3px;bottom:calc(32.3px + 15.3px + env(safe-area-inset-bottom,0px));z-index:6;height:51px;border-radius:25.5px;

/* App never gets wider than the Boox Palma's screen height (824 points), centred on wider screens */
:root{--side:max(0px, calc((100vw - 824px) / 2))}
body{max-width:824px;margin:0 auto}
.vp,.status,.chrome{left:var(--side);right:var(--side)}

/* never let the header push buttons off-screen on narrow phones */

@media (max-width:400px){.top-row .brand span{display:none}}
.fabbar{left:calc(var(--side) + 15.3px);right:calc(var(--side) + 15.3px)}
.toast{left:calc(var(--side) + 10.2px);right:calc(var(--side) + 10.2px)}
/* ---------- Fully rounded UI (all themes): pills for controls, circles for icon buttons, rounder covers ---------- */
.btn,.seg,.search,.sortwrap select,.field input,.field select,.fontbtn,.step,.tag,.toast,.dupbar{border-radius:999px}
.btn.icon,.more,.star:not(.cstar),.x{border-radius:50%}

.list:not(.grid) .open:focus-visible,.cell .copen:focus-visible{border-radius:16px}
/* ---------- Soft theme (for phones): warm grey, gentle contrast, pill shapes, thin lines ---------- */

  --accent:#111111; --accent-ink:#F6F4EE; --line2:#D6D0C4; --field:#FAF8F3; --sheet:#FAF8F3;

}

[data-theme="soft"] .toast{border:0;border-radius:999px;background:var(--ink);color:var(--bg)}
[data-theme="soft"] .rbar{border-bottom:1px solid var(--soft)}
/* floating, card-like pieces with soft shadows; charcoal for the main actions (no green/lime) */
[data-theme="soft"] .top{border-bottom:0}
[data-theme="soft"] .search,[data-theme="soft"] .sortwrap select{background:var(--sheet);border:1px solid var(--line2);box-shadow:var(--shadow)}
[data-theme="soft"] .top-row .seg{background:var(--sheet);box-shadow:var(--shadow)}
[data-theme="soft"] #addBtn{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);border-radius:50%;box-shadow:var(--shadow)}
[data-theme="soft"] #addBtn2{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
[data-theme="soft"] .list:not(.grid) .item{margin:10px 16px;border:1px solid var(--line2);border-radius:24px;background:var(--sheet)}
[data-theme="soft"] .list:not(.grid) .open{padding-left:14px}
[data-theme="soft"] .now{border:1px solid var(--line2);background:var(--sheet);box-shadow:var(--shadow)}
[data-theme="soft"] .nowhead,[data-theme="soft"] .count{text-transform:none;letter-spacing:0;font-size:14px;font-weight:500}
[data-theme="soft"] .fab{background:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow)}
[data-theme="soft"] .fabbar{background:var(--sheet);color:var(--ink);border:1px solid var(--line2);box-shadow:var(--shadow)}
[data-theme="soft"] .fabbar #fbPlay{background:var(--accent);color:var(--accent-ink);border-radius:50%;width:48px;height:48px}
[data-theme="soft"] .prog .bar i,[data-theme="soft"] .cbar i{background:var(--ink)}
[data-theme="soft"] .cstar{background:radial-gradient(circle, var(--sheet) 0 14.4px, transparent 14.9px);color:var(--ink)}
[data-theme="soft"] .tag{background:var(--sheet);color:var(--ink);border-color:var(--ink)}
[data-theme="soft"] dialog .field input,[data-theme="soft"] dialog .field select,[data-theme="soft"] dialog .field textarea,[data-theme="soft"] dialog .fontbtn{background:#ECE7DD}
/* Segmented controls (List|Grid, Theme): a pill track with a pill-shaped selected item, no divider lines */
.seg{padding:3px;gap:2px;overflow:visible;align-items:center}
.seg button{border-radius:999px;border:0 !important}
.seg button + button{border-left:0 !important}
.viewseg button{min-width:44px}
.top-row #addBtn{width:44px;height:44px;min-height:44px}
/* Book title running vertically up the left margin of the reading page, faint like the bottom bar */
.sidetitle{position:fixed;z-index:3;left:calc(var(--side) + 3px);top:calc(env(safe-area-inset-top,0px) + 24px);bottom:calc(32px + 24px + env(safe-area-inset-bottom,0px));
  writing-mode:vertical-rl;transform:rotate(180deg);text-align:center;font-size:11px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  color:color-mix(in srgb,var(--rink) 30%,var(--rbg));pointer-events:none;font-family:var(--ui)}
/* extra space between the vertical title and the text: wider left padding, columns still exactly one screen apart */
.page.sidegap{padding-left:calc(var(--mx,18.7px) + 14px);column-width:calc(var(--pw,360px) - 2 * var(--mx,18.7px) - 14px);column-gap:calc(2 * var(--mx,18.7px) + 14px)}
.status .st{white-space:pre}
/* reading progress shown as a tag (same look as the tags on covers) next to the title in the reader's top bar */
#rChap{align-self:center;background:transparent;color:var(--rink);border:1.5px solid var(--rink);border-radius:999px;padding:1px 7px;font-size:11px;font-weight:700;line-height:1.4}
[data-theme="soft"] #rChap{background:transparent;color:var(--rink)}
/* Continue reading (list view) on narrow screens: cards side by side, swipe sideways */
@media (max-width:600px){
  .nowrow{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 13.6px;padding:0 13.6px 6px;margin-bottom:4px;scrollbar-width:none}
  .nowrow::-webkit-scrollbar{display:none}
  .nowrow .now{flex:0 0 86%;margin:0;scroll-snap-align:start}
  .nowrow .now:only-child{flex-basis:100%}
}
/* Bottom bar divider = mini progress bar: read part ─ ◆ ─ rest of the book, faint like the bar */
.status{border-top-color:transparent !important}
.sprog{position:absolute;left:20.4px;right:11.9px;top:-5px;height:10px;display:flex;align-items:center;gap:5px;pointer-events:none;--p:0}
.sprog i{display:block;height:1px;border-radius:1px;background:currentColor}
.sprog .a{flex:none;width:calc((100% - 20px) * var(--p))}
.sprog .c{flex:1 1 0;min-width:0}
.sprog .d{flex:none;display:block;width:10px;height:10px}
.sprog .d svg{display:block;width:10px;height:10px;fill:currentColor}
.sprog .d .fc{fill:var(--rbg)}
/* Covers view: just the covers (with the progress tag), 4 per row on phones, more on wide screens */
#libraryView[data-mode="covers"] .cell .ctitle,#libraryView[data-mode="covers"] .cell .cmeta,#libraryView[data-mode="covers"] .cell .cstar{display:none}
#libraryView[data-mode="covers"] .list.grid{grid-template-columns:repeat(4,1fr);gap:10px}
@media (min-width:600px){#libraryView[data-mode="covers"] .list.grid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}}
#libraryView[data-mode="covers"] .cell .thumb .tt{font-size:11px}
#libraryView[data-mode="covers"] .nowgrid{grid-auto-columns:min(calc((100% - 30px) / 4 * 1.3), 130px);gap:10px}
.cell .copen{-webkit-touch-callout:none;user-select:none}
/* Scroll read mode */
body.scrollmode .vp{overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
body.scrollmode .page{height:auto;column-width:auto !important;column-count:1;column-gap:0 !important;padding-bottom:28px;transform:none !important}
body.scrollmode .endnote{break-before:auto;height:auto;padding:36px 0}
.chapnav{display:flex;justify-content:center;padding:18px 0;font-family:var(--ui);font-size:14px}
.chapnav.prev{justify-content:flex-start}
.chapnav.next{justify-content:flex-end}
.chapnav .btn{border-color:var(--rink);color:var(--rink);background:var(--rbg)}
/* pictures inside books: centred, never wider than the text or taller than one page */
.page figure.bimg{margin:0 0 .75em;padding:0;text-align:center;text-indent:0;break-inside:avoid;line-height:0}
.page figure.bimg img{display:inline-block;width:auto;height:auto;max-width:100%;max-height:var(--colh,70vh);object-fit:contain}
.page figure.bimg.speaking img{outline:3px solid var(--rhl);outline-offset:2px}
/* little pictures inside a line of text (arrows, symbols): text-sized */
.page img.icon{display:inline-block;height:1.15em;width:auto;max-width:3em;vertical-align:-0.2em;object-fit:contain}
.page img.icon.pre{margin-right:.3em}
.page img.icon.post{margin-left:.3em}
/* count line with the Hide/Show finished switch on the right */
.countrow{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:10.2px 13.6px 3.4px}
.countrow .count{padding:0}
.linkbtn{all:unset;box-sizing:border-box;cursor:pointer;font-size:11.5px;font-weight:600;color:var(--ink);text-decoration:underline;text-underline-offset:2px;padding:6px 0;white-space:nowrap}
.linkbtn:focus-visible{outline:2.5px solid var(--ink);outline-offset:2px}
/* Ruled lines: a thin, soft, dashed line under every line of text, like a notebook.
   Drawn from the real position of each line on the page (see drawRules), so they always sit under the text. */
.page{--rule:color-mix(in srgb,var(--rink) 30%,var(--rbg));position:relative}
.page > .rules{position:absolute;left:0;top:0;width:0;height:0;pointer-events:none}
.page > .rules i{position:absolute;display:block;height:1px;background-image:linear-gradient(to right,var(--rule) 50%,transparent 50%);background-size:6px 1px}
</style>
</head>

    const f = zip.file(m.href); if (!f) continue;
    const doc = new DOMParser().parseFromString(await f.async('string'), 'text/html');
    const dir = m.href.includes('/') ? m.href.slice(0, m.href.lastIndexOf('/') + 1) : '';
    if (doc.querySelector('img,image')) for (const l of doc.querySelectorAll('link[href]')) {
      if (!/stylesheet/i.test(l.getAttribute('rel') || '') && !/\.css$/i.test(l.getAttribute('href'))) continue;
      const p = joinPath(dir, l.getAttribute('href'));
      if (!(p in cssCache)) { const cf = zip.file(p); cssCache[p] = cf ? await cf.async('string').catch(() => '') : ''; }
      if (cssCache[p]) { const s = doc.createElement('style'); s.textContent = cssCache[p]; (doc.head || doc.documentElement).append(s); }
    }
    const blocks = extractBlocks(doc, dir); if (!blocks.length) continue;
    const firstH = blocks.find(b => b.k === 'h');
    chapters.push({ title: labels[m.href] || (firstH ? firstH.x : ''), blocks });
  }
  /* pictures: read each one from the EPUB once, remember its size so pages can be laid out before it loads */
  const typeOf = {}; for (const m of Object.values(manifest)) typeOf[m.href] = m.type;
  const extType = p => ({ jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', gif: 'image/gif', webp: 'image/webp', svg: 'image/svg+xml', bmp: 'image/bmp' })[(p.split('.').pop() || '').toLowerCase()] || '';
  const images = {}, dims = {};
  const refs = blk => blk.k === 'img' ? [blk] : [...(blk.pre || []), ...(blk.post || [])];
  for (const c of chapters) for (const blk of c.blocks) for (const b of refs(blk)) {
    if (b.s.startsWith('data:') || b.s in images) continue;
    images[b.s] = null;
    const f = zip.file(b.s); if (!f) continue;
    try {
      const raw = await f.async('blob'), type = (typeOf[b.s] || '').startsWith('image/') ? typeOf[b.s] : extType(b.s);
      images[b.s] = type ? raw.slice(0, raw.size, type) : raw;
      try { const bm = await createImageBitmap(images[b.s]); dims[b.s] = [bm.width, bm.height, iconLike(bm)]; bm.close && bm.close(); } catch {}
    } catch {}
  }
  for (const c of chapters) {
    c.blocks = c.blocks.filter(b => b.k !== 'img' || b.s.startsWith('data:') || images[b.s]);
    for (const b of c.blocks) if (b.k === 'img' && dims[b.s]) { b.w = dims[b.s][0]; b.h = dims[b.s][1]; if (dims[b.s][2] && !b.dw && !b.dh) b.ic = 1; }
    for (const b of c.blocks) for (const k of ['pre', 'post']) if (b[k]) { b[k] = b[k].filter(i => i.s.startsWith('data:') || images[i.s]); if (!b[k].length) delete b[k]; }
  }
  for (const k of Object.keys(images)) if (!images[k]) delete images[k];
  for (let i = chapters.length - 1; i >= 0; i--) if (!chapters[i].blocks.length) chapters.splice(i, 1);
  if (!coverHref) { const cm = metas.find(m => m.getAttribute('name') === 'cover'); const cid = cm && cm.getAttribute('content'); if (cid && manifest[cid] && manifest[cid].type.startsWith('image/')) coverHref = manifest[cid].href; }
  if (!coverHref) { const g = Object.entries(manifest).find(([id, m]) => m.type.startsWith('image/') && /cover/i.test(id + ' ' + m.href)); if (g) coverHref = g[1].href; }
  let cover = null;
  try { if (coverHref && zip.file(coverHref)) cover = await zip.file(coverHref).async('blob'); } catch {}
  return { cover, images, series, seriesNo: Number.isFinite(seriesNo) ? seriesNo : null, chapters: splitBig(chapters), title: dc('title'), author: dc('creator'), lang: dc('language'), desc: dc('description').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim() };
}
function guessSeries(name){
  const s = (name || '').replace(/_+/g, ' ').replace(/\s+/g, ' ').trim();
  let m = s.match(/^(.+?)(?:[\s.,:–—(\[-]+(?:vol(?:ume)?|book|tập|tap|quyển|quyen|phần|phan|part|tome|no)\.?|\s*#)\s*(\d+(?:\.\d+)?)(?!\d)/iu);
  if (!m) m = s.match(/^(.+?)[\s.,:–—#-]+(\d{1,3})(?:\s*[-–:)].*)?$/u);
  if (!m) return null;
  const series = m[1].replace(/[\s.,:–—(\[-]+$/u, '').trim();
  if (series.length < 2 || /^\d+$/.test(series)) return null;
  return { series, seriesNo: parseFloat(m[2]) };
}
async function decodeText(file){
  const buf = await file.arrayBuffer();

  catch { try { return new TextDecoder('windows-1258').decode(buf); } catch { return new TextDecoder().decode(buf); } }
}
async function parseFile(file, ext){

  else if (ext === 'md' || ext === 'markdown') r = { chapters: parsePlain(await decodeText(file), true) };
  else if (['html','htm','xhtml'].includes(ext)) r = parseHtml(await decodeText(file));
  else throw new Error(t('unsupported'));
  if (!r.chapters.length) throw new Error(t('noText'));
  return r;
}

async function makeCover(blob){

    const w = 200, h = Math.max(1, Math.min(320, Math.round(bmp.height * w / bmp.width)));
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, w, h);
    const s = Math.max(w / bmp.width, h / bmp.height), dw = bmp.width * s, dh = bmp.height * s;

}
const BOOK_EXT = ['epub','txt','md','markdown','html','htm','xhtml'], FONT_EXT = ['ttf','otf','woff','woff2'];
const extOf = name => (name.split('.').pop() || '').toLowerCase();

/* A .zip of books is unpacked and each book inside is added */
async function expandZips(files, failures){
  const out = [];
  for (const f of files) {
    if (extOf(f.name) !== 'zip') { out.push(f); continue; }
    try {
      if (!window.JSZip) throw new Error('ZIP reader failed to load');
      progress(t('opening', { f: f.name }));
      let zip; try { zip = await JSZip.loadAsync(f); } catch { throw new Error(t('badZip')); }
      const entries = Object.values(zip.files).filter(z => !z.dir && !/(^|\/)(__MACOSX|\.)/.test(z.name) && [...BOOK_EXT, ...FONT_EXT].includes(extOf(z.name)));
      for (const z of entries) out.push(new File([await z.async('blob')], z.name.split('/').pop()));
      if (!entries.length) failures.push({ f: f.name, e: t('noBooksInZip') });
    } catch (e) { failures.push({ f: f.name, e: e.message || String(e) }); }
  }
  return out;
}
async function addFiles(files){
  const failures = [];
  files = await expandZips([...files], failures);
  let n = 0, i = 0, skipped = 0;
  const have = new Set(books.map(dupKey));
  for (const f of files) {
    i++; if (files.length > 1) progress(t('adding', { i, n: files.length }));
    const ext = extOf(f.name);
    if (FONT_EXT.includes(ext)) { await addFont(f); continue; }
    const key = f.name + '|' + f.size;
    if (have.has(key)) { skipped++; continue; }
    try {
      const r = await parseFile(f, ext);
      const sample = r.chapters.slice(0, 3).flatMap(c => c.blocks.map(b => b.x)).join(' ');
      const id = uid();
      const title = r.title || f.name.replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' ').replace(/\s+/g, ' ').trim();
      const sg = r.series ? { series: r.series, seriesNo: r.seriesNo } : (guessSeries(title) || guessSeries(f.name.replace(/\.[^.]+$/, '')) || { series: '', seriesNo: null });
      const meta = {
        id, title, series: sg.series || '', seriesNo: sg.seriesNo ?? null, author: r.author || '',
        lang: normLang(r.lang, sample), desc: r.desc || '', tags: [],
        format: ext === 'markdown' ? 'md' : ext === 'htm' ? 'html' : ext, fileName: f.name, size: f.size,
        cover: await makeCover(r.cover),
        addedAt: Date.now(), chapterCount: r.chapters.length, progress: { ch: 0, p: 0, pct: 0 }
      };
      await idbPut('content', { id, chapters: r.chapters, images: r.images || null });
      await idbPut('meta', meta);
      n++; have.add(key);
    } catch (e) { failures.push({ f: f.name, e: e.message || String(e) }); }
  }
  $('#toast').hidden = true;
  if (n || skipped) toast(skipped ? (n ? t('addedSkipped', { n, s: skipped }) : t('skipped', { s: skipped })) : t('added', { n }));
  if (n) { try { navigator.storage?.persist?.(); } catch {} }
  if (failures.length) showFailures(failures);
  await refreshLibrary();
}

      const len = part.s.length;
      u.onstart = () => onUttStart(my, ch, para, part.off);
      u.onend = () => { tts.fails = 0; onUttEnd(my, len); };
      u.onerror = ev => {
        if (my !== tts.token || ev.error === 'interrupted' || ev.error === 'canceled') return;
        /* Fallbacks before giving up: 1) let Android pick its default voice, 2) stop the screen-off keep-alive track */
        tts.fails = (tts.fails || 0) + 1;
        if (tts.fails === 1 && !tts.forceDefault) { tts.forceDefault = true; ttsPlay(para); return; }
        if (tts.fails <= 2 && !tts.noKeepAlive && prefs.bg) { tts.noKeepAlive = true; ttsPlay(para); return; }
        tts.fails = 0; ttsStop(); toast(t('ttsError', { code: ev.error || 'error' }));
      };
      synth.speak(u);
      tts.queued += len; used += len;
    }
    if (para + 1 < blocks.length) tts.next = { ch, para: para + 1 };
    else if (ch + 1 < cur.chapters.length) tts.next = { ch: ch + 1, para: 0 };
    else tts.next = null;
  }
  if (!tts.queued && !tts.next) ttsStop();
}
function onUttStart(my, ch, para, off){
  if (my !== tts.token || !cur) return;
  tts.errors = 0;
  if (ch !== cur.ch) { renderChapter(ch, para); updateMedia(); }
  if (tts.para !== para || !pg.querySelector('.reading')) { tts.para = para; highlight(para); saveProgress(); }
  if (!document.hidden) { if (scrollMode()) paras()[para]?.scrollIntoView({ block: 'center' }); else showOffset(paras()[para], off); }
}
function onUttEnd(my, len){
  if (my !== tts.token || !tts.on) return;
  tts.queued -= len;
  if (tts.queued <= 0 && !tts.next) { ttsStop(); saveProgress(true); return; }
  if (tts.queued < 1500) enqueue(document.hidden ? BIG_BATCH : SMALL_BATCH);
}
function ttsPause(){ tts.on = false; tts.token++; synth?.cancel(); keepAlive(false); updateTTSBar(); }
function ttsStop(){ ttsPause(); tts.para = null; tts.next = null; highlight(null); updateTTSBar(); }

/* Keep-alive: a silent looping track makes Android treat the page as media,
   so it isn't frozen with the screen off and gets lock-screen controls. */
let keepAudio = null;
function silentWavUrl(){
  const sr = 8000, n = sr * 10, buf = new ArrayBuffer(44 + n), v = new DataView(buf);
  const w = (o, str) => { for (let i = 0; i < str.length; i++) v.setUint8(o + i, str.charCodeAt(i)); };
  w(0, 'RIFF'); v.setUint32(4, 36 + n, true); w(8, 'WAVE'); w(12, 'fmt '); v.setUint32(16, 16, true);
  v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, sr, true); v.setUint32(28, sr, true);
  v.setUint16(32, 1, true); v.setUint16(34, 8, true); w(36, 'data'); v.setUint32(40, n, true);
  new Uint8Array(buf, 44).fill(128);
  return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
}
function keepAlive(on){
  try {
    if (on) { if (!keepAudio) { keepAudio = new Audio(silentWavUrl()); keepAudio.loop = true; } keepAudio.play().catch(() => {}); }
    else keepAudio?.pause();
  } catch {}
  if ('mediaSession' in navigator) try { navigator.mediaSession.playbackState = tts.on ? 'playing' : 'paused'; } catch {}
}
function updateMedia(){
  if (!('mediaSession' in navigator) || !cur || !window.MediaMetadata) return;
  try { navigator.mediaSession.metadata = new MediaMetadata({ title: chapTitle(cur.ch), artist: cur.meta.author || '', album: cur.meta.title }); } catch {}
}
if ('mediaSession' in navigator) {
  const on = (a, f) => { try { navigator.mediaSession.setActionHandler(a, f); } catch {} };
  on('play', () => { if (cur) ttsPlay(); });
  on('pause', () => ttsPause());
  on('stop', () => ttsStop());
  on('nexttrack', () => { if (cur && cur.ch < cur.chapters.length - 1) { renderChapter(cur.ch + 1, 0); ttsPlay(0); } });
  on('previoustrack', () => { if (!cur) return; if (cur.ch > 0 && (tts.para ?? 0) < 2) renderChapter(cur.ch - 1, 0); ttsPlay(0); });
  on('seekforward', () => { if (cur && tts.para != null) ttsPlay(Math.min(tts.para + 1, paras().length - 1)); });
  on('seekbackward', () => { if (cur && tts.para != null) ttsPlay(Math.max(0, tts.para - 1)); });
}
document.addEventListener('visibilitychange', () => {
  if (!cur || !tts.on) return;
  if (document.hidden) enqueue(BIG_BATCH);
  else if (tts.para != null) { highlight(tts.para); const pp = pageOfPara(tts.para); if (pp !== curPage) goPage(pp); }
});
const toggleTTS = () => tts.on ? ttsPause() : ttsPlay();
$('#playBtn').onclick = () => { toggleTTS(); if (tts.on) showChrome(false); };
$('#miniPlay').onclick = toggleTTS;
$('#stopBtn').onclick = ttsStop;
$('#bgBtn').onclick = () => { prefs.bg = !prefs.bg; savePrefs(); updateTTSBar(); if (tts.on) keepAlive(prefs.bg); };
$('#voiceSel').onchange = e => { store.set('voice-' + bookLang(), e.target.value); tts.forceDefault = false; tts.fails = 0; if (tts.on) ttsPlay(tts.para); };
document.querySelectorAll('[data-rate]').forEach(b => b.onclick = () => stepRate(+b.dataset.rate));
if (synth) synth.addEventListener?.('voiceschanged', () => { if (cur) updateVoices(); });
/* iPhone/iPad often load the voice list late without announcing it: keep checking for a few seconds */
if (synth) { let tries = 0, last = -1; const poll = setInterval(() => {
  const n = synth.getVoices().length; tries++;
  if (n !== last) { last = n; if (cur) updateVoices(); }
  if (tries > 30) clearInterval(poll);
}, 500); }

/* ================= Wiring ================= */
$('#addBtn').onclick = $('#addBtn2').onclick = () => $('#bookInput').click();
$('#bookInput').onchange = async e => { const fs = [...e.target.files]; e.target.value = ''; await addFiles(fs); };
$('#search').oninput = renderLibrary;
$('#sortSel').value = sortBy;
$('#sortSel').onchange = e => { sortBy = e.target.value; store.set('sort', sortBy); renderLibrary(); scrollTo(0, 0); };
document.querySelectorAll('[data-lview]').forEach(b => b.onclick = () => { view = b.dataset.lview; store.set('view', view); renderLibrary(); });
$('#dupBtn').onclick = async () => {
  let n = 0;
  for (const g of dupGroups()) {
    g.sort((a, b) => (b.progress?.pct || 0) - (a.progress?.pct || 0) || (b.openedAt || 0) - (a.openedAt || 0) || a.addedAt - b.addedAt);
    for (const d of g.slice(1)) { await idbDel('meta', d.id); await idbDel('content', d.id); n++; }
  }
  toast(t('dupRemoved', { n })); refreshLibrary();
};
$('#seriesBack').onclick = () => { openSeries = null; renderLibrary(); scrollTo(0, 0); };
$('#doneBtn').onclick = () => { doneOnly = !doneOnly; store.set('doneOnly', doneOnly); renderLibrary(); scrollTo(0, 0); };
document.querySelectorAll('[data-ui]').forEach(b => b.onclick = () => { uiLang = b.dataset.ui; store.set('ui', uiLang); applyI18n(); });
addEventListener('dragover', e => { if (e.dataTransfer?.types.includes('Files')) e.preventDefault(); });
addEventListener('drop', e => { if (!e.dataTransfer?.files.length) return; e.preventDefault(); if (!cur) addFiles([...e.dataTransfer.files]); });
/* keep the clock in the bottom bar current (only redraws when the minute changes) */
setInterval(() => { if (cur && !document.hidden) updateStatus(); }, 15000);
addEventListener('pagehide', () => saveProgress(true));
/* Save the exact page the moment the app goes to the background (closing from recent apps may skip pagehide) */
document.addEventListener('visibilitychange', () => { if (document.hidden) saveProgress(true); });

if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
mountIcons(); disarmDelete();
applyPrefs(); applyI18n(); refreshLibrary().then(() => {
  try {
    const r = JSON.parse(sessionStorage.getItem('bs-reopen') || 'null'); sessionStorage.removeItem('bs-reopen');
    if (r && r.id) openBook(r.id).then(() => { if (r.settings) $('#setBtn').click(); });
  } catch {}
});
loadFonts();
</script>
</body>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bookshelf · Tủ sách</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Literata:ital,opsz,wght@0,7..72,400..700;1,7..72,400..700&family=Lora:ital,wght@0,400..700;1,400..700&family=Noto+Serif:ital,wght@0,400..700;1,400..700&display=swap">
<script src="jszip.min.js"></script>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
/* Designed for E Ink phones (Boox Palma): pure black & white, no motion, big targets, paged reading. */
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
  --bg:#FFFFFF; --ink:#000000; --muted:#333333; --soft:#B5B5B5; --hl:#D4D4D4;
  --accent:#000000; --accent-ink:#FFFFFF;
  --ui:"Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --serif:Literata, Georgia, "Times New Roman", serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#000000; --ink:#FFFFFF; --muted:#CFCFCF; --soft:#5C5C5C; --hl:#3D3D3D;
    --accent:#FFFFFF; --accent-ink:#000000;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#000000; --ink:#FFFFFF; --muted:#CFCFCF; --soft:#5C5C5C; --hl:#3D3D3D;
  --accent:#FFFFFF; --accent-ink:#000000;
}
*,*::before,*::after{box-sizing:inherit;transition:none !important;animation:none !important}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.45;font-weight:500;
  --rbg:var(--bg); --rink:var(--ink); --rmuted:var(--muted); --rhl:var(--hl);
}
body[data-rt="paper"]{--rbg:#FFFFFF;--rink:#000000;--rmuted:#333333;--rhl:#D4D4D4}
body[data-rt="invert"]{--rbg:#000000;--rink:#FFFFFF;--rmuted:#CFCFCF;--rhl:#3D3D3D}
body[data-view="reader"]{overflow:hidden;background:var(--rbg)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
body[data-view="reader"]::before{background:var(--rbg)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 16px;border:2px solid var(--ink);background:var(--bg);color:var(--ink);border-radius:8px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.plain{border-color:transparent}
.btn.danger.armed{background:var(--ink);color:var(--bg)}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none !important}
.noterow{display:flex;align-items:flex-start;gap:8px}
.noterow > p{flex:1}
.x{all:unset;box-sizing:border-box;flex:none;width:38px;height:38px;margin:-9px -9px 0 0;display:grid;place-items:center;cursor:pointer}
.x .ri{width:20px;height:20px}
.x:focus-visible{outline:3px solid currentColor;outline-offset:-3px}
.ri{width:1.25em;height:1.25em;flex:none;fill:currentColor;display:inline-block;vertical-align:-.25em}
.btn .ri{width:22px;height:22px}
.btn.icon{padding:0;width:46px}
.ri.big{width:56px;height:56px;margin-bottom:12px}
.searchwrap{position:relative;margin-top:12px}
.searchrow{display:flex;gap:8px;margin-top:12px}
.searchrow .searchwrap{flex:1;min-width:0;margin-top:0}
.sortwrap{flex:none}
.sortwrap select{min-height:46px;border:2px solid var(--ink);border-radius:8px;background:var(--bg);color:var(--ink);padding:0 10px 0 12px;font-size:15px;font-weight:600;max-width:150px}
.searchwrap .ri,.selwrap .ri{position:absolute;top:50%;transform:translateY(-50%);pointer-events:none;width:22px;height:22px}
.searchwrap .ri{left:13px}
.selwrap{position:relative;display:block}
.selwrap .ri{right:12px}
.selwrap select{appearance:none;-webkit-appearance:none;padding-right:42px !important}
.seg{display:inline-flex;border:2px solid var(--ink);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;min-height:42px;padding:0 13px;cursor:pointer;font-weight:600}
.seg button+button{border-left:2px solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* ---------- Library ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:2px solid var(--ink);padding:12px 16px 12px}
.top-row{display:flex;align-items:center;gap:10px}
.brand{font-family:var(--serif);font-size:27px;font-weight:700;margin:0 auto 0 0;letter-spacing:-.01em;line-height:1.1;display:flex;align-items:center;gap:10px}
.logo{height:26px;width:auto;fill:currentColor;flex:none}
.search{display:block;width:100%;padding-left:44px !important;min-height:46px;border:2px solid var(--ink);background:var(--bg);border-radius:8px;padding:0 14px;font-size:16px}
.search::placeholder{color:var(--muted);opacity:1}
.count{margin:0;padding:12px 16px 4px;color:var(--muted);font-size:13.5px}
.shead{padding:10px 8px 4px;border-bottom:2px solid var(--ink)}
.shead .btn{padding:0 8px}
.shead h2{font-family:var(--serif);font-weight:700;font-size:24px;margin:4px 8px 0;line-height:1.2}
.shead p{margin:2px 8px 10px;color:var(--muted);font-size:13.5px}
.list{list-style:none;margin:0;padding:0 0 calc(40px + env(safe-area-inset-bottom,0px))}
.item{display:flex;align-items:stretch;border-bottom:1px solid var(--soft)}
.open{all:unset;box-sizing:border-box;flex:1;min-width:0;display:flex;gap:15px;padding:14px 4px 14px 16px;cursor:pointer}
.open:focus-visible,.more:focus-visible{outline:3px solid var(--ink);outline-offset:-3px}
.more{all:unset;box-sizing:border-box;flex:none;width:54px;display:grid;place-items:center;cursor:pointer}
.more .ri{width:26px;height:26px}
.thumb{display:block;flex:none;position:relative;width:58px;height:86px;border:2px solid var(--ink);border-radius:2px 5px 5px 2px;background:var(--bg);color:var(--ink);
  padding:6px 5px 5px 9px;box-shadow:inset 3px 0 0 var(--ink);overflow:hidden}
.thumb .tt{font-family:var(--serif);font-size:10px;line-height:1.15;font-weight:700;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.thumb.s1{background:var(--ink);color:var(--bg);box-shadow:inset 3px 0 0 var(--bg)}
.thumb.s2::after{content:"";position:absolute;left:3px;right:0;bottom:16px;height:7px;background:var(--ink)}
.thumb.stack{margin:8px 8px 0 0;box-shadow:inset 3px 0 0 var(--ink),4px -4px 0 -2px var(--bg),4px -4px 0 0 var(--ink),8px -8px 0 -2px var(--bg),8px -8px 0 0 var(--ink);overflow:visible}
.thumb.stack.s1{box-shadow:inset 3px 0 0 var(--bg),4px -4px 0 -2px var(--bg),4px -4px 0 0 var(--ink),8px -8px 0 -2px var(--bg),8px -8px 0 0 var(--ink)}
.thumb.img{padding:0}
.thumb.img::after{content:none}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;border-radius:inherit}
.now{margin:0 16px 10px;border:2px solid var(--ink);border-radius:10px}
.nowhead{margin:16px 16px 8px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.nowgrid{display:grid;grid-template-columns:repeat(2,calc((100% - 28px) / 3 * 1.3));justify-content:start;gap:16px 18px;margin:0 16px 6px}
.nowgrid .cell .ctitle b{font-size:15px}
.viewseg button{padding:0 10px;display:grid;place-items:center}
.viewseg .ri{width:20px;height:20px}
/* Grid view */
.list.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px 14px;padding:14px 16px calc(40px + env(safe-area-inset-bottom,0px))}
.cell{display:flex;flex-direction:column;min-width:0}
.cell .copen{all:unset;box-sizing:border-box;display:block;cursor:pointer;position:relative}
.tag{position:absolute;left:8px;bottom:8px;max-width:calc(100% - 20px);background:var(--bg);color:var(--ink);border:1.5px solid var(--ink);border-radius:4px;font-size:11px;font-weight:700;line-height:1.4;padding:1px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .copen:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.cell .thumb{width:100%;height:auto;aspect-ratio:2/3;padding:9px 7px 7px 11px}
.cell .thumb.img{padding:0}
.cell .thumb.stack{width:calc(100% - 8px)}
.cell .thumb .tt{font-size:13px;-webkit-line-clamp:7}
.cell .thumb.s2::after{bottom:22%;height:8px}
.ctitle{display:flex;align-items:flex-start;gap:2px;margin-top:8px}
.ctitle b{flex:1;min-width:0;font-family:var(--serif);font-size:14px;line-height:1.25;font-weight:700;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.cell .more{width:30px;height:26px;margin-top:-3px}
.cell .more .ri{width:20px;height:20px}
.cmeta{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cbar{height:5px;border:1.5px solid var(--ink);border-radius:3px;overflow:hidden;margin-top:6px}
.cbar i{display:block;height:100%;background:var(--ink)}
.now > button{all:unset;box-sizing:border-box;display:flex;gap:16px;width:100%;padding:14px;cursor:pointer;border-radius:8px}
.now > button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.now .thumb{width:72px;height:108px}
.now .lbl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.now .txt b{font-size:20px}
.txt{min-width:0;flex:1;display:flex;flex-direction:column;gap:2px}
.txt b{font-family:var(--serif);font-size:18px;line-height:1.25;font-weight:700;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.txt .au,.txt .sn{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.txt .sn{font-style:italic}
.prog{margin-top:auto;padding-top:6px;display:flex;align-items:center;gap:10px;font-size:13px}
.prog .bar{flex:0 1 110px;height:6px;border:1.5px solid var(--ink);border-radius:3px;overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--ink)}
.empty{padding:16vh 28px 0;text-align:center}
.empty h2{font-family:var(--serif);font-weight:700;font-size:26px;margin:0 0 10px}
.empty p{color:var(--muted);margin:0 0 24px}
.nomatch{padding:40px 24px;text-align:center;color:var(--muted)}

/* ---------- Reader (paged) ---------- */
.vp{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);bottom:calc(38px + env(safe-area-inset-bottom,0px));overflow:hidden;background:var(--rbg);color:var(--rink);touch-action:manipulation}
.page{height:100%;width:100%;padding:26px var(--mx,22px) 6px;
  column-width:calc(var(--pw,360px) - 2 * var(--mx,22px));column-gap:calc(2 * var(--mx,22px));column-fill:auto;
  font-family:var(--rfont,var(--serif));font-size:var(--rsize,20px);line-height:var(--rlh,1.6);font-weight:var(--rw,400);overflow-wrap:break-word;hyphens:auto}
.page p{margin:0 0 .75em;orphans:2;widows:2}
.page h2{font-size:1.3em;line-height:1.25;margin:0 0 .8em;font-weight:700;break-after:avoid}
.page p + h2{margin-top:1.2em}
.page .reading{background:var(--rhl);-webkit-box-decoration-break:clone;box-decoration-break:clone}
.endnote{break-before:column;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;height:100%;text-align:center;font-family:var(--ui);font-size:16px}
.endnote p{margin:0;font-family:var(--serif);font-size:22px;font-weight:700}
.endnote .btn{border-color:var(--rink);color:var(--rink);background:var(--rbg);white-space:normal;padding:10px 16px;max-width:100%}
.status{position:fixed;left:0;right:0;bottom:0;z-index:4;height:calc(38px + env(safe-area-inset-bottom,0px));padding:0 4px env(safe-area-inset-bottom,0px);
  display:flex;align-items:center;gap:4px;font-size:13px;background:var(--rbg);color:var(--rink);border-top:1px solid var(--rink)}
.status button{all:unset;box-sizing:border-box;min-width:42px;height:38px;display:grid;place-items:center;font-size:16px;font-weight:700;cursor:pointer}
.status button .ri{width:22px;height:22px}
.status button:focus-visible{outline:3px solid var(--rink);outline-offset:-3px}
/* Low-contrast bottom bar so it doesn't compete with the text */
.status{color:color-mix(in srgb,var(--rink) 30%,var(--rbg));border-top-color:color-mix(in srgb,var(--rink) 20%,var(--rbg));padding-left:24px;padding-right:14px}
.status .sc{flex:1;min-width:0;display:flex;white-space:nowrap}
.status .st{min-width:0;overflow:hidden;text-overflow:ellipsis}
.status .sch{flex:none;white-space:pre;padding-right:12px}
.status .sp{white-space:nowrap;padding-right:6px;font-variant-numeric:tabular-nums}
.chrome{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;color:var(--rink)}
.chrome .btn{border-color:var(--rink);color:var(--rink);background:var(--rbg)}
.chrome .btn.primary{background:var(--rink);color:var(--rbg)}
.chrome .btn.plain{border-color:transparent}
.chrome .btn[aria-pressed="true"]{background:var(--rink);color:var(--rbg)}
.rbar{background:var(--rbg);border-bottom:2px solid var(--rink);padding:calc(8px + env(safe-area-inset-top,0px)) 8px 10px}
.rbar-row{display:flex;align-items:center;gap:6px}
.rbar-row .grow{flex:1}
.sys{text-align:right;padding-right:8px;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;white-space:pre}
.rtitle-row{display:flex;align-items:center;gap:2px}
#backBtn{padding-left:10px}
.rtitle-row .rtitle{flex:1;min-width:0;padding:4px 8px 0 0}
.rtitle{padding:6px 8px 0}
.rtitle b{display:block;font-family:var(--serif);font-weight:700;font-size:18px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rtitle span{display:block;font-size:13.5px;color:var(--rmuted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scrim{flex:1}
.tts{background:var(--rbg);border-top:2px solid var(--rink);padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));display:grid;gap:12px}
.tts .row{display:flex;gap:10px;align-items:center}
.tts .row .play{flex:1;min-width:0}
.tts select{width:100%;min-height:46px;background:var(--rbg);color:var(--rink);border:2px solid var(--rink);border-radius:8px;padding:0 10px;font-weight:500}
.note{margin:0;font-size:13px;color:var(--rmuted);line-height:1.4}
.step{display:inline-flex;align-items:center;border:2px solid currentColor;border-radius:8px;overflow:hidden}
.step button{all:unset;box-sizing:border-box;min-width:48px;height:42px;display:grid;place-items:center;font-weight:700;font-size:17px;cursor:pointer}
.step button .ri{width:20px;height:20px}
.step button:focus-visible{outline:3px solid currentColor;outline-offset:-3px}
.step output{min-width:62px;text-align:center;border-left:2px solid currentColor;border-right:2px solid currentColor;height:42px;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* ---------- Sheets ---------- */
dialog{border:0;border-top:2px solid var(--ink);border-radius:0;background:var(--bg);color:var(--ink);padding:0;width:100%;max-width:100%;max-height:94%;margin:auto 0 0;overflow:auto}
@media (min-width:640px){dialog{width:540px;margin:auto;border:2px solid var(--ink);border-radius:10px}}
dialog::backdrop{background:rgba(0,0,0,.4)}
.dh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 12px 4px 18px}
.dh h2{margin:0;font-family:var(--serif);font-weight:700;font-size:22px}
.db{padding:10px 18px;display:grid;gap:16px}
.df{padding:6px 18px calc(18px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.df .push{margin-right:auto}
.field{display:grid;gap:6px;font-size:14px;font-weight:600}
.field input,.field select,.field textarea{font-size:16px;font-weight:400;color:var(--ink);background:var(--bg);border:2px solid var(--ink);border-radius:8px;padding:10px 12px;width:100%;min-height:46px}
.field textarea{min-height:90px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.two.series2{grid-template-columns:1fr 84px;gap:8px}
@media (max-width:400px){.two.wrap{grid-template-columns:1fr}}
.filemeta{font-size:13px;color:var(--muted);margin:0}
.preview{border:2px solid var(--ink);border-radius:8px;padding:12px 14px;font-size:20px;line-height:1.45}
.hint{font-size:13px;color:var(--muted);margin:-8px 0 0}
.ufonts{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.ufonts li{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:16px}
.ufonts .btn{min-height:38px;padding:0 12px}
.slabel{font-weight:600;font-size:15px}
.faillist{list-style:none;margin:0;padding:4px 18px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:10px;max-height:60vh;overflow:auto}
.faillist li{display:grid;gap:2px;font-size:14px;border-bottom:1px solid var(--soft);padding-bottom:8px}
.faillist b{overflow-wrap:anywhere}
.faillist span{color:var(--muted)}
.dupbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:12px 16px 0;padding:8px 8px 8px 14px;border:2px solid var(--ink);border-radius:8px;font-size:14px;font-weight:600}
.dupbar .btn{min-height:40px;padding:0 12px}
.toc{list-style:none;margin:0;padding:0 0 calc(12px + env(safe-area-inset-bottom,0px))}
.toc li{border-bottom:1px solid var(--soft)}
.toc button{all:unset;box-sizing:border-box;display:block;width:100%;padding:13px 18px;cursor:pointer;font-size:16px;line-height:1.35}
.toc button:focus-visible{outline:3px solid var(--ink);outline-offset:-3px}
.toc button[aria-current="true"]{font-weight:700;background:var(--ink);color:var(--bg)}
.toast{position:fixed;left:12px;right:12px;bottom:calc(52px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--bg);color:var(--ink);border:2px solid var(--ink);padding:12px 14px;border-radius:8px;font-size:15px;text-align:center}
</style>
</head>
<body data-view="library">

<!-- ============ Library ============ -->
<section id="libraryView">
  <header class="top">
    <div class="top-row">
      <h1 class="brand"><svg class="logo" viewBox="242 133 391 256" aria-hidden="true"><polygon points="242,135 286,135 286,389 242,389"/><polygon points="327,135 372,135 372,389 327,389"/><polygon points="435,194 464,168 633,358 599,387"/><polygon points="372,147 414,133 494,373 452,387"/></svg><span data-i="brand">Bookshelf</span></h1>
      <div class="seg viewseg" role="group" data-ia="view">
        <button type="button" data-lview="list" data-ia="viewList"><i data-ic="list-unordered"></i></button><button type="button" data-lview="grid" data-ia="viewGrid"><i data-ic="layout-grid-line"></i></button>
      </div>
      <button class="btn primary icon" id="addBtn" type="button" data-ia="addBooks"><i data-ic="add-line"></i></button>
    </div>
    <div class="searchrow">
      <div class="searchwrap"><i data-ic="search-line"></i><input class="search" id="search" type="search" data-ip="search" data-ia="search" autocomplete="off"></div>
      <span class="selwrap sortwrap"><select id="sortSel" data-ia="sortBy">
        <option value="recent" data-i="sRecent"></option>
        <option value="added" data-i="sAdded"></option>
        <option value="title" data-i="sTitle"></option>
        <option value="author" data-i="sAuthor"></option>
        <option value="progress" data-i="sProgress"></option>
      </select><i data-ic="arrow-down-s-line"></i></span>
    </div>
  </header>
  <div class="shead" id="seriesHead" hidden>
    <button class="btn plain" type="button" id="seriesBack"><i data-ic="arrow-left-line"></i><span data-i="allBooks"></span></button>
    <h2 id="seriesTitle"></h2><p id="seriesCount"></p>
  </div>
  <div id="nowWrap"></div>
  <p class="count" id="count"></p>

  const raw = $('#search').value.trim(), q = fold(raw);
  let list = sortBooks(q ? books.filter(b => fold([b.title, b.author, b.series, (b.tags||[]).join(' ')].join(' ')).includes(q)) : books);
  if (openSeries && !seriesBooks(openSeries).length) openSeries = null;
  $('#seriesHead').hidden = !openSeries;
  $('#empty').hidden = books.length > 0;
  $('#count').hidden = !books.length || !!openSeries;
  $('#count').textContent = t('count', { n: books.length });
  updateDupBar();
  const grid = view === 'grid';
  shelf.classList.toggle('grid', grid);
  document.querySelectorAll('[data-lview]').forEach(b => b.setAttribute('aria-pressed', b.dataset.lview === view));
  const nw = $('#nowWrap'); nw.replaceChildren();
  const latest = (!openSeries && !q) ? books.filter(b => b.openedAt && (b.progress?.pct || 0) < 99).sort((a, b) => b.openedAt - a.openedAt).slice(0, 2) : [];
  if (latest.length) {
    nw.append(el('h2', 'nowhead', t('nowReading')));
    if (grid) { const g = el('div', 'nowgrid'); latest.forEach(b => g.append(bookCell(b, true))); nw.append(g); }
    else latest.forEach(b => nw.append(nowCard(b)));
  }
  if (openSeries) {
    const sb = seriesBooks(openSeries);
    $('#seriesTitle').textContent = sb[0].series;
    $('#seriesCount').textContent = t('nBooks', { n: sb.length });
    list = list.filter(b => skey(b) === openSeries).sort(byNo);
  }
  $('#noMatch').hidden = !(books.length && !list.length);
  $('#noMatch').textContent = t('noMatch', { q: raw });
  const shown = new Set();
  for (const b of list) {
    const k = skey(b);
    if (!openSeries && !q && k) {
      if (shown.has(k)) continue;
      shown.add(k);
      const sb = seriesBooks(k);
      if (sb.length > 1) { shelf.append(grid ? seriesCell(k, sb) : seriesRow(k, sb)); continue; }
    }
    shelf.append(grid ? bookCell(b) : bookRow(b));
  }
}

/* Shrinks a cover image to a small JPEG (stored with the book) */
async function makeCover(blob){
  if (!blob) return null;
  try {
    const bmp = await createImageBitmap(blob);
    const w = 200, h = Math.max(1, Math.min(320, Math.round(bmp.height * w / bmp.width)));
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, w, h);
    const s = Math.max(w / bmp.width, h / bmp.height), dw = bmp.width * s, dh = bmp.height * s;
    x.drawImage(bmp, (w - dw) / 2, (h - dh) / 2, dw, dh);
    bmp.close?.();
    return c.toDataURL('image/jpeg', 0.82);
  } catch { return null; }
}
const BOOK_EXT = ['epub','txt','md','markdown','html','htm','xhtml'], FONT_EXT = ['ttf','otf','woff','woff2'];
const extOf = name => (name.split('.').pop() || '').toLowerCase();
function progress(msg){ const e = $('#toast'); e.textContent = msg; e.hidden = false; clearTimeout(toastTimer); }
/* A .zip of books is unpacked and each book inside is added */
async function expandZips(files, failures){
  const out = [];
  for (const f of files) {
    if (extOf(f.name) !== 'zip') { out.push(f); continue; }
    try {
      if (!window.JSZip) throw new Error('ZIP reader failed to load');
      progress(t('opening', { f: f.name }));
      let zip; try { zip = await JSZip.loadAsync(f); } catch { throw new Error(t('badZip')); }
      const entries = Object.values(zip.files).filter(z => !z.dir && !/(^|\/)(__MACOSX|\.)/.test(z.name) && [...BOOK_EXT, ...FONT_EXT].includes(extOf(z.name)));
      for (const z of entries) out.push(new File([await z.async('blob')], z.name.split('/').pop()));
      if (!entries.length) failures.push({ f: f.name, e: t('noBooksInZip') });
    } catch (e) { failures.push({ f: f.name, e: e.message || String(e) }); }
  }
  return out;
}
async function addFiles(files){
  const failures = [];
  files = await expandZips([...files], failures);
  let n = 0, i = 0, skipped = 0;
  const have = new Set(books.map(dupKey));
  for (const f of files) {
    i++; if (files.length > 1) progress(t('adding', { i, n: files.length }));
    const ext = extOf(f.name);
    if (FONT_EXT.includes(ext)) { await addFont(f); continue; }
    const key = f.name + '|' + f.size;
    if (have.has(key)) { skipped++; continue; }
    try {
      const r = await parseFile(f, ext);
      const sample = r.chapters.slice(0, 3).flatMap(c => c.blocks.map(b => b.x)).join(' ');
      const id = uid();
      const title = r.title || f.name.replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' ').replace(/\s+/g, ' ').trim();
      const sg = r.series ? { series: r.series, seriesNo: r.seriesNo } : (guessSeries(title) || guessSeries(f.name.replace(/\.[^.]+$/, '')) || { series: '', seriesNo: null });
      const meta = {
        id, title, series: sg.series || '', seriesNo: sg.seriesNo ?? null, author: r.author || '',
        lang: normLang(r.lang, sample), desc: r.desc || '', tags: [],
        format: ext === 'markdown' ? 'md' : ext === 'htm' ? 'html' : ext, fileName: f.name, size: f.size,
        cover: await makeCover(r.cover),
        addedAt: Date.now(), chapterCount: r.chapters.length, progress: { ch: 0, p: 0, pct: 0 }
      };
      await idbPut('content', { id, chapters: r.chapters });
      await idbPut('meta', meta);
      n++; have.add(key);
    } catch (e) { failures.push({ f: f.name, e: e.message || String(e) }); }
  }
  $('#toast').hidden = true;
  if (n || skipped) toast(skipped ? (n ? t('addedSkipped', { n, s: skipped }) : t('skipped', { s: skipped })) : t('added', { n }));
  if (n) { try { navigator.storage?.persist?.(); } catch {} }
  if (failures.length) showFailures(failures);
  await refreshLibrary();
}
function showFailures(list){
  $('#failTitle').textContent = t('failedTitle', { n: list.length });
  const ul = $('#failList'); ul.replaceChildren();
  list.forEach(x => { const li = el('li'); li.append(el('b', null, x.f), el('span', null, x.e)); ul.append(li); });
  $('#failDlg').showModal();
}

/* Series picker: existing series, none, or a new name */
function fillSeriesSel(current){
  const sel = $('#seriesSel'); sel.replaceChildren();
  const c = new Intl.Collator(uiLang === 'vi' ? 'vi' : 'en', { numeric: true, sensitivity: 'base' });
  const names = [], seen = new Set();
  books.forEach(x => { const k = skey(x); if (x.series && !seen.has(k)) { seen.add(k); names.push(x.series); } });
  names.sort(c.compare);
  const add = (v, txt) => { const o = el('option', null, txt); o.value = v; sel.append(o); };
  add('', t('noSeries')); names.forEach(n => add(n, n)); add('__new', t('newSeries'));
  const match = names.find(n => fold(n).trim() === fold(current).trim());
  sel.value = current ? (match || '__new') : '';
  syncSeries(false);
}
function syncSeries(userChange){
  const f = $('#editForm'), v = $('#seriesSel').value, isNew = v === '__new';
  f.series.hidden = !isNew;
  f.seriesNo.disabled = !v;
  if (!isNew) f.series.value = v;
  else if (userChange) { f.series.value = ''; f.series.focus(); }
  if (userChange && v && !isNew && !f.seriesNo.value) {
    const nums = books.filter(x => x.id !== editingId && skey(x) === fold(v).trim() && x.seriesNo != null).map(x => x.seriesNo);
    f.seriesNo.value = nums.length ? Math.floor(Math.max(...nums)) + 1 : 1;
  }
}

/* ================= Fonts & reading prefs ================= */
const BUILTIN = [
  { v:'Literata', n:'Literata', css:'Literata, Georgia, serif' },
  { v:'Noto Serif', n:'Noto Serif', css:'"Noto Serif", Georgia, serif' },
  { v:'Lora', n:'Lora', css:'Lora, Georgia, serif' },
  { v:'Be Vietnam Pro', n:'Be Vietnam Pro', css:'"Be Vietnam Pro", system-ui, sans-serif' },
  { v:'sys-serif', n:'sysSerif', css:'Georgia, "Times New Roman", serif', i:true },
  { v:'sys-sans', n:'sysSans', css:'system-ui, -apple-system, "Segoe UI", Roboto, sans-serif', i:true }
];
const LIM = { size:[14, 34, 1], lh:[1.2, 2.2, 0.1], mx:[8, 48, 4], rate:[0.5, 2.5, 0.1], uiScale:[60, 120, 10] };
let userFonts = [], fontsLoaded = false;
let prefs = Object.assign({ font:'Literata', size:20, lh:1.6, mx:22, bold:false, rt:'auto', rate:1, bg:true, fs:false, uiScale:80 }, store.get('prefs', {}));
if (prefs.rt === 'sepia') prefs.rt = 'paper';
if (prefs.rt === 'night') prefs.rt = 'invert';
/* One-time switch to the new 80% default app size (can still be changed in Aa > App size) */
if (!store.get('scale80', false)) { prefs.uiScale = 80; store.set('scale80', true); store.set('prefs', prefs); }
function savePrefs(){ store.set('prefs', prefs); }
/* App size: makes the phone lay out a wider page, so everything (menus, buttons and text) draws smaller */
function applyScale(){
  const meta = document.querySelector('meta[name=viewport]'); if (!meta) return;
  const s = prefs.uiScale || 100;
  const content = s === 100 ? 'width=device-width, initial-scale=1, viewport-fit=cover'
    : 'width=' + Math.round((screen.width || innerWidth) * 100 / s) + ', initial-scale=' + s / 100 + ', minimum-scale=' + s / 100 + ', maximum-scale=' + s / 100 + ', viewport-fit=cover';
  if (meta.getAttribute('content') !== content) meta.setAttribute('content', content);
}
/* Some browsers only apply a new app size on reload: reload and reopen the same book */
function checkScale(){
  setTimeout(() => {
    const s = prefs.uiScale || 100, want = Math.round((screen.width || innerWidth) * 100 / s);
    if (Math.abs(innerWidth - want) <= 2) return;
    try { if (cur) { saveProgress(true); sessionStorage.setItem('bs-reopen', JSON.stringify({ id: cur.meta.id, settings: true })); } } catch {}
    setTimeout(() => location.reload(), 150);
  }, 400);
}
function fontCss(key){
  if (key.startsWith('uf:')) return `"uf-${key.slice(3)}", Literata, Georgia, serif`;
  return (BUILTIN.find(f => f.v === key) || BUILTIN[0]).css;
}
async function registerFont(f){ const ff = new FontFace('uf-' + f.id, f.data); await ff.load(); document.fonts.add(ff); }
async function loadFonts(){
  let all = []; try { all = await idbAll('fonts'); } catch {}
  for (const f of all) { try { await registerFont(f); userFonts.push({ id: f.id, name: f.name }); } catch {} }
  fontsLoaded = true;
  renderFontOptions(); applyPrefs();
}
async function addFont(file){
  const name = file.name.replace(/\.[^.]+$/, '');
  try {
    const f = { id: uid(), name, data: await file.arrayBuffer() };
    await registerFont(f); await idbPut('fonts', f);
    userFonts.push({ id: f.id, name });
    prefs.font = 'uf:' + f.id; savePrefs();
    renderFontOptions(); applyPrefs(); toast(t('fontAdded', { n: name }));
  } catch { toast(t('fontFailed', { n: name })); }
}
function renderFontOptions(){
  const sel = $('#fontSel'); sel.replaceChildren();
  for (const f of BUILTIN) { const o = el('option', null, f.i ? t(f.n) : f.n); o.value = f.v; sel.append(o); }
  if (userFonts.length) {

    sel.append(g);
  }

  sel.value = prefs.font; if (!sel.value && fontsLoaded) { prefs.font = 'Literata'; sel.value = 'Literata'; savePrefs(); }
  const ul = $('#ufList'); ul.replaceChildren(); $('#ufWrap').hidden = !userFonts.length;
  for (const f of userFonts) {
    const li = el('li'); const n = el('span', null, f.name); n.style.fontFamily = `"uf-${f.id}"`;
    const rm = el('button', 'btn'); setLabel(rm, t('remove'), 'delete-bin-line'); rm.type = 'button';
    rm.onclick = async () => {
      await idbDel('fonts', f.id); userFonts = userFonts.filter(x => x.id !== f.id);

  if (!('mediaSession' in navigator) || !cur || !window.MediaMetadata) return;
  try { navigator.mediaSession.metadata = new MediaMetadata({ title: chapTitle(cur.ch), artist: cur.meta.author || '', album: cur.meta.title }); } catch {}
}
if ('mediaSession' in navigator) {
  const on = (a, f) => { try { navigator.mediaSession.setActionHandler(a, f); } catch {} };
  on('play', () => { if (cur) ttsPlay(); });
  on('pause', () => ttsPause());
  on('stop', () => ttsStop());
  on('nexttrack', () => { if (cur && cur.ch < cur.chapters.length - 1) { renderChapter(cur.ch + 1, 0); ttsPlay(0); } });
  on('previoustrack', () => { if (!cur) return; if (cur.ch > 0 && (tts.para ?? 0) < 2) renderChapter(cur.ch - 1, 0); ttsPlay(0); });
  on('seekforward', () => { if (cur && tts.para != null) ttsPlay(Math.min(tts.para + 1, paras().length - 1)); });
  on('seekbackward', () => { if (cur && tts.para != null) ttsPlay(Math.max(0, tts.para - 1)); });
}
document.addEventListener('visibilitychange', () => {
  if (!cur || !tts.on) return;
  if (document.hidden) enqueue(BIG_BATCH);
  else if (tts.para != null) { highlight(tts.para); const pp = pageOfPara(tts.para); if (pp !== curPage) goPage(pp); }
});
const toggleTTS = () => tts.on ? ttsPause() : ttsPlay();
$('#playBtn').onclick = () => { toggleTTS(); if (tts.on) showChrome(false); };
$('#miniPlay').onclick = toggleTTS;
$('#stopBtn').onclick = ttsStop;
$('#bgBtn').onclick = () => { prefs.bg = !prefs.bg; savePrefs(); updateTTSBar(); if (tts.on) keepAlive(prefs.bg); };
$('#voiceSel').onchange = e => { store.set('voice-' + bookLang(), e.target.value); tts.forceDefault = false; tts.fails = 0; if (tts.on) ttsPlay(tts.para); };
document.querySelectorAll('[data-rate]').forEach(b => b.onclick = () => {
  const [lo, hi, st] = LIM.rate;
  prefs.rate = Math.round(Math.min(hi, Math.max(lo, prefs.rate + st * +b.dataset.rate)) * 10) / 10;
  savePrefs(); $('#rateOut').textContent = prefs.rate.toFixed(1) + '×';
  if (tts.on) ttsPlay(tts.para);
});
if (synth) synth.addEventListener?.('voiceschanged', () => { if (cur) updateVoices(); });

/* ================= Wiring ================= */
$('#addBtn').onclick = $('#addBtn2').onclick = () => $('#bookInput').click();
$('#bookInput').onchange = async e => { const fs = [...e.target.files]; e.target.value = ''; await addFiles(fs); };
$('#search').oninput = renderLibrary;
$('#sortSel').value = sortBy;
$('#sortSel').onchange = e => { sortBy = e.target.value; store.set('sort', sortBy); renderLibrary(); scrollTo(0, 0); };
document.querySelectorAll('[data-lview]').forEach(b => b.onclick = () => { view = b.dataset.lview; store.set('view', view); renderLibrary(); });
$('#dupBtn').onclick = async () => {
  let n = 0;
  for (const g of dupGroups()) {
    g.sort((a, b) => (b.progress?.pct || 0) - (a.progress?.pct || 0) || (b.openedAt || 0) - (a.openedAt || 0) || a.addedAt - b.addedAt);
    for (const d of g.slice(1)) { await idbDel('meta', d.id); await idbDel('content', d.id); n++; }
  }
  toast(t('dupRemoved', { n })); refreshLibrary();
};
$('#seriesBack').onclick = () => { openSeries = null; renderLibrary(); scrollTo(0, 0); };
document.querySelectorAll('[data-ui]').forEach(b => b.onclick = () => { uiLang = b.dataset.ui; store.set('ui', uiLang); applyI18n(); });
addEventListener('dragover', e => { if (e.dataTransfer?.types.includes('Files')) e.preventDefault(); });
addEventListener('drop', e => { if (!e.dataTransfer?.files.length) return; e.preventDefault(); if (!cur) addFiles([...e.dataTransfer.files]); });
addEventListener('pagehide', () => saveProgress(true));
/* Save the exact page the moment the app goes to the background (closing from recent apps may skip pagehide) */
document.addEventListener('visibilitychange', () => { if (document.hidden) saveProgress(true); });

if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
mountIcons(); disarmDelete();
applyPrefs(); applyI18n(); refreshLibrary().then(() => {
  try {
    const r = JSON.parse(sessionStorage.getItem('bs-reopen') || 'null'); sessionStorage.removeItem('bs-reopen');
    if (r && r.id) openBook(r.id).then(() => { if (r.settings) $('#setBtn').click(); });
  } catch {}
});
loadFonts();
</script>
</body>
</html>
